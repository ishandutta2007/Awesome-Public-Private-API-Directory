<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#101827" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#titleGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: url(#subGrad);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }
    .card-border {
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 1;
      fill: url(#cardGrad);
    }

    /* Ambient and dynamic background animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }

    .pulse-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 180px 90px;
    }
    .pulse-orb-2 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 1020px 270px;
    }
    .animated-card-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .animated-card-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .grid-line {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }
    .flow-line {
      stroke: url(#titleGrad);
      stroke-width: 2;
      stroke-dasharray: 6 6;
      animation: dashCycle 3s linear infinite;
      opacity: 0.35;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Subtle Decorative Grid Lines -->
  <line x1="0" y1="90" x2="1200" y2="90" class="grid-line" />
  <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
  <line x1="0" y1="270" x2="1200" y2="270" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle cx="180" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.3" class="pulse-orb-1" />
  <circle cx="1020" cy="270" r="150" fill="#818cf8" filter="url(#glow)" opacity="0.3" class="pulse-orb-2" />
  <circle cx="950" cy="80" r="110" fill="#c084fc" filter="url(#glow)" opacity="0.25" class="pulse-orb-1" />

  <!-- Animated Dynamic Data Flows -->
  <path d="M 60,310 Q 350,290 600,320 T 1140,300" fill="none" class="flow-line" />
  <path d="M 60,70 Q 400,100 650,60 T 1140,80" fill="none" class="flow-line" />

  <!-- Floating Background Decorative Cards -->
  <g class="animated-card-1">
    <rect x="70" y="45" width="140" height="75" rx="10" class="card-border" />
    <rect x="85" y="60" width="45" height="8" rx="4" fill="#38bdf8" opacity="0.8" />
    <rect x="85" y="75" width="90" height="6" rx="3" fill="#ffffff" opacity="0.25" />
    <rect x="85" y="87" width="65" height="6" rx="3" fill="#ffffff" opacity="0.25" />
    <circle cx="190" cy="64" r="4" fill="#22c55e" />
  </g>

  <g class="animated-card-2">
    <rect x="990" y="195" width="140" height="75" rx="10" class="card-border" />
    <rect x="1005" y="210" width="55" height="8" rx="4" fill="#c084fc" opacity="0.8" />
    <rect x="1005" y="225" width="90" height="6" rx="3" fill="#ffffff" opacity="0.25" />
    <rect x="1005" y="237" width="60" height="6" rx="3" fill="#ffffff" opacity="0.25" />
    <circle cx="1110" cy="214" r="4" fill="#38bdf8" />
  </g>

  <!-- Foreground Main Branding & Text (In Foreground, Never Obscured) -->
  <g id="foreground-content">
    <!-- Icon/Badge Centerpiece -->
    <g transform="translate(600, 70)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="url(#titleGrad)" stroke-width="2" />
      <!-- Network / API Hub Icon -->
      <circle cx="0" cy="0" r="6" fill="#38bdf8" />
      <circle cx="-14" cy="-8" r="4" fill="#818cf8" />
      <circle cx="14" cy="-8" r="4" fill="#818cf8" />
      <circle cx="0" cy="15" r="4" fill="#c084fc" />
      <line x1="0" y1="0" x2="-14" y2="-8" stroke="#38bdf8" stroke-width="1.8" />
      <line x1="0" y1="0" x2="14" y2="-8" stroke="#38bdf8" stroke-width="1.8" />
      <line x1="0" y1="0" x2="0" y2="15" stroke="#38bdf8" stroke-width="1.8" />
    </g>

    <!-- Main Title -->
    <text x="600" y="155" text-anchor="middle" class="title">
      Awesome Public &amp; Private API Directory
    </text>

    <!-- Subtitle -->
    <text x="600" y="200" text-anchor="middle" class="subtitle">
      Curated Catalog of API Hubs, Marketplaces, Discovery Portals &amp; Open-Source Directories
    </text>

    <!-- Feature Badges / Pills (Centered) -->
    <g transform="translate(600, 255)">
      <!-- Pill 1: Public Hubs -->
      <g transform="translate(-320, 0)">
        <rect x="0" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
        <text x="72" y="22" text-anchor="middle" class="badge-text">🌐 Public Hubs</text>
      </g>
      <!-- Pill 2: Private Catalogs -->
      <g transform="translate(-160, 0)">
        <rect x="0" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
        <text x="75" y="22" text-anchor="middle" class="badge-text">🔒 Internal Catalogs</text>
      </g>
      <!-- Pill 3: OpenAPI & MCP -->
      <g transform="translate(5, 0)">
        <rect x="0" y="0" width="155" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.95" />
        <text x="77" y="22" text-anchor="middle" class="badge-text">⚡ OpenAPI &amp; MCP</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
        <text x="72" y="22" text-anchor="middle" class="badge-text">⭐ Open Source</text>
      </g>
    </g>
  </g>
</svg>