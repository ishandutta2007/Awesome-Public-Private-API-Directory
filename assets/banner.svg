<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e17"/><stop offset="50%" stop-color="#101827"/><stop offset="100%" stop-color="#0b1120"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="40%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.1)}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}.bg{fill:url(#bgGrad)}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#titleGrad);letter-spacing:-.5px}.subtitle{font-weight:400;font-size:18px;fill:url(#subGrad)}.badge-text{font-weight:600;font-size:13px;fill:#e0e7ff}.card-border{stroke:rgba(255,255,255,.12);stroke-width:1;fill:url(#cardGrad)}.pulse-orb-1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:180px 90px}.pulse-orb-2{animation:pulseGlow 7s ease-in-out infinite;transform-origin:1020px 270px}.animated-card-1{animation:floatCard1 5s ease-in-out infinite}.animated-card-2{animation:floatCard2 6s ease-in-out infinite}.grid-line{stroke:rgba(255,255,255,.04);stroke-width:1}.flow-line{stroke:url(#titleGrad);stroke-width:2;stroke-dasharray:6 6;animation:dashCycle 3s linear infinite;opacity:.35}</style><rect width="1200" height="360" class="bg" rx="16"/><line x1="0" x2="1200" y1="90" y2="90" class="grid-line"/><line x1="0" x2="1200" y1="180" y2="180" class="grid-line"/><line x1="0" x2="1200" y1="270" y2="270" class="grid-line"/><line x1="300" x2="300" y1="0" y2="360" class="grid-line"/><line x1="600" x2="600" y1="0" y2="360" class="grid-line"/><line x1="900" x2="900" y1="0" y2="360" class="grid-line"/><circle cx="180" cy="90" r="140" fill="#38bdf8" class="pulse-orb-1" filter="url(#glow)" opacity=".3"/><circle cx="1020" cy="270" r="150" fill="#818cf8" class="pulse-orb-2" filter="url(#glow)" opacity=".3"/><circle cx="950" cy="80" r="110" fill="#c084fc" class="pulse-orb-1" filter="url(#glow)" opacity=".25"/><path fill="none" d="M 60,310 Q 350,290 600,320 T 1140,300" class="flow-line"/><path fill="none" d="M 60,70 Q 400,100 650,60 T 1140,80" class="flow-line"/><g class="animated-card-1"><rect width="140" height="75" x="70" y="45" class="card-border" rx="10"/><rect width="45" height="8" x="85" y="60" fill="#38bdf8" opacity=".8" rx="4"/><rect width="90" height="6" x="85" y="75" fill="#fff" opacity=".25" rx="3"/><rect width="65" height="6" x="85" y="87" fill="#fff" opacity=".25" rx="3"/><circle cx="190" cy="64" r="4" fill="#22c55e"/></g><g class="animated-card-2"><rect width="140" height="75" x="990" y="195" class="card-border" rx="10"/><rect width="55" height="8" x="1005" y="210" fill="#c084fc" opacity=".8" rx="4"/><rect width="90" height="6" x="1005" y="225" fill="#fff" opacity=".25" rx="3"/><rect width="60" height="6" x="1005" y="237" fill="#fff" opacity=".25" rx="3"/><circle cx="1110" cy="214" r="4" fill="#38bdf8"/></g><g id="foreground-content"><g transform="translate(600, 70)"><circle cx="0" cy="0" r="28" fill="#1e293b" stroke="url(#titleGrad)" stroke-width="2"/><circle cx="0" cy="0" r="6" fill="#38bdf8"/><circle cx="-14" cy="-8" r="4" fill="#818cf8"/><circle cx="14" cy="-8" r="4" fill="#818cf8"/><circle cx="0" cy="15" r="4" fill="#c084fc"/><line x1="0" x2="-14" y1="0" y2="-8" stroke="#38bdf8" stroke-width="1.8"/><line x1="0" x2="14" y1="0" y2="-8" stroke="#38bdf8" stroke-width="1.8"/><line x1="0" x2="0" y1="0" y2="15" stroke="#38bdf8" stroke-width="1.8"/></g><text x="600" y="155" class="title" text-anchor="middle">Awesome Public &amp; Private API Directory</text><text x="600" y="200" class="subtitle" text-anchor="middle">Curated Catalog of API Hubs, Marketplaces, Discovery Portals &amp; Open-Source Directories</text><g><g transform="translate(600, 255) translate(-320, 0)"><rect width="145" height="34" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".95" rx="17"/><text x="72" y="22" class="badge-text" text-anchor="middle">🌐 Public Hubs</text></g><g transform="translate(600, 255) translate(-160, 0)"><rect width="150" height="34" x="0" y="0" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity=".95" rx="17"/><text x="75" y="22" class="badge-text" text-anchor="middle">🔒 Internal Catalogs</text></g><g transform="translate(600, 255) translate(5, 0)"><rect width="155" height="34" x="0" y="0" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity=".95" rx="17"/><text x="77" y="22" class="badge-text" text-anchor="middle">⚡ OpenAPI &amp; MCP</text></g><g transform="translate(600, 255) translate(175, 0)"><rect width="145" height="34" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".95" rx="17"/><text x="72" y="22" class="badge-text" text-anchor="middle">⭐ Open Source</text></g></g></g></svg>